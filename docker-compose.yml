services:
  bot:
    build: .
    env_file: .env
    environment:
      PYTHONUNBUFFERED: '1'
    volumes:
    - downloads:/app/downloads
    - ${LIBRARY_HOST_DIR:-/tmp}:/library:ro
    - ${COOKIES_HOST_PATH:-/dev/null}:/cookies/cookies.txt
    dns:
    - 8.8.8.8
    - 1.1.1.1
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat 2>/dev/null || echo
        0) )) -lt 120
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
    - botnet
networks:
  botnet:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
volumes:
  downloads: null
