services:
  bot:
    build: .
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      # persists the downloads cache (instant replays of the same Telegram file)
      - downloads:/app/downloads
      # local media library (read-only). Set LIBRARY_HOST_DIR in .env to your
      # media folder; defaults to /tmp (empty) so the library feature stays off.
      - ${LIBRARY_HOST_DIR:-/tmp}:/library:ro
    # Docker's embedded resolver (127.0.0.11) mishandles CNAME-chained answers
    # for some upstream domains (radio/IPTV stream hosts especially) — glibc's
    # getaddrinfo() gets EAI_NODATA even though the raw DNS answer is valid.
    # Going straight to a public resolver sidesteps that proxy layer.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    healthcheck:
      # main.py touches /tmp/heartbeat every 30s; unhealthy if it goes stale
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat 2>/dev/null || echo 0) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  downloads:
